<!-- Dark Ink theme toggle. Default dark; remembers the visitor's choice. -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('hb-theme');
    if (saved === 'light') {
      document.documentElement.setAttribute('data-hb-theme', 'light');
    }
  } catch (e) {}

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.createElement('button');
    btn.className = 'hb-theme-toggle';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Toggle light and dark theme');

    function isLight() {
      return document.documentElement.getAttribute('data-hb-theme') === 'light';
    }
    function paint() {
      btn.textContent = isLight() ? '\u263E' : '\u263C'; /* moon : sun */
    }
    paint();

    btn.addEventListener('click', function () {
      if (isLight()) {
        document.documentElement.removeAttribute('data-hb-theme');
        try { localStorage.setItem('hb-theme', 'dark'); } catch (e) {}
      } else {
        document.documentElement.setAttribute('data-hb-theme', 'light');
        try { localStorage.setItem('hb-theme', 'light'); } catch (e) {}
      }
      paint();
    });

    document.body.appendChild(btn);
  });
})();
</script>
